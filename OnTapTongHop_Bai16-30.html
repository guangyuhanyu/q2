@media (max-aspect-ratio:4/5){.bg{background-position:68% center}}
.home{width:100%;max-width:520px;margin-bottom:12px}
.home a{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--vien);color:var(--tieu-de);font-weight:600;font-size:15px;padding:8px 16px 8px 12px;border-radius:999px;text-decoration:none}
.home a:hover{background:#eef6f8}
.home a:focus-visible,.go:focus-visible,.zalo:focus-visible,.who button:focus-visible{outline:3px solid rgba(22,116,140,.5);outline-offset:2px}
.box{position:relative;width:100%;max-width:520px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.8);border-radius:20px;box-shadow:0 6px 24px rgba(13,86,106,.14);padding:24px 22px 22px;text-align:center}
.box::before{content:"";position:absolute;inset:9px;border:1.5px solid #d3e7ec;border-radius:14px;pointer-events:none}
.brand{display:flex;align-items:center;justify-content:center;gap:12px}
.brand a{line-height:0;border-radius:10px}
.brand img{width:58px;height:58px;object-fit:contain}
.brand div{text-align:left;line-height:1.3}
.brand b{display:block;font-size:18px;color:var(--tieu-de)}
.brand span{font-size:13.5px;color:var(--phu)}
.lock{width:64px;height:64px;margin:18px auto 6px;border-radius:16px;background:var(--son);display:grid;place-items:center;transform:rotate(-5deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.3)}
.lock svg{width:32px;height:32px;color:#fff}
.k{font-size:15px;font-weight:600;color:var(--xanh);margin-top:6px}
h1{font-weight:700;font-size:34px;line-height:1.35;margin:4px 0 2px;color:var(--tieu-de)}
h1.zh{font-family:var(--han)}
h1.vi{font-family:var(--vi);font-size:28px}
.sub{font-size:15px;color:var(--phu);margin:0 0 4px}
p{margin:8px 0;color:var(--phu);font-size:16px;line-height:1.55}
.field{margin-top:14px}
input{width:100%;font:inherit;font-size:24px;letter-spacing:.14em;text-align:center;padding:12px 14px;border:2px solid var(--vien);border-radius:14px;background:#f3f9fa;color:var(--muc)}
input:focus{outline:none;border-color:var(--tieu-de);background:#fff;box-shadow:0 0 0 4px var(--soc)}
.go{margin-top:14px;border:0;border-radius:999px;font:inherit;font-weight:700;font-size:18px;padding:12px 38px;background:var(--tieu-de);color:#fff;box-shadow:0 6px 16px rgba(13,86,106,.28);cursor:pointer}
.go:hover{background:#0a4656}
.go[disabled]{opacity:.6;cursor:default}
.msg{min-height:22px;margin-top:12px;font-weight:600;font-size:15px;color:#b3261e}
.zalo{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--soc);border:1px solid var(--vien);color:var(--muc);text-decoration:none;font-weight:600;border-radius:999px;padding:6px 14px;font-size:15px}
.who{margin-top:10px;font-size:14px;color:var(--phu)}
.who button{border:0;background:none;color:var(--tieu-de);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:2px}
.loading{margin-top:18px;font-weight:700;color:var(--tieu-de)}
.noi{margin-top:16px;font-size:12.5px;letter-spacing:.08em;color:#7d969e;text-transform:uppercase}
footer{margin-top:14px;font-size:14px;font-weight:500;color:#24424d}
@media(max-width:420px){.box{padding:22px 16px 18px}h1{font-size:28px}h1.vi{font-size:24px}.brand img{width:48px;height:48px}.brand b{font-size:16px}input{font-size:21px}}
</style>

<script>
const UNIT="T16_30";
const panel=document.getElementById("panel");
const esc=x=>String(x||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NOT=n=>{n=esc(n);return `Phần này tự mở khi mã của <b>${n}</b> được mở đủ Bài 16 – Bài 30. Liên hệ Thầy Vy để mở thêm.`};
async function openLesson(){
  try{const html=await GY.decrypt(UNIT,document.getElementById("gy-data").textContent.trim());
    document.open();document.write(html);document.close();return true}
  catch(e){if(e.message==="old"){panel.innerHTML='<p class="msg">Trình duyệt quá cũ. Hãy cập nhật iOS / Chrome rồi mở lại.</p>';return true}return false}
}
function form(msg){
  const s=GY.rawSession();
  panel.innerHTML=`<p>Phần này dành cho học viên đã đăng ký. Nhập <b>mã học viên</b> Thầy Vy đã gửi cho bạn.</p>
   <div class="field"><input id="code" placeholder="XXXXXXXX" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Mã học viên" value="${s&&s.code?esc(s.code):""}"></div>
   <button class="go" id="go" type="button">Mở bài</button>
   <div class="msg" id="msg">${msg||""}</div>
   <a class="zalo" href="https://zalo.me/${window.GY_ZALO||""}" target="_blank" rel="noopener">💬 Zalo Thầy Vy ${window.GY_ZALO||""}</a>
   ${s&&s.name?`<div class="who">Đang dùng mã của <b>${esc(s.name)}</b> · <button type="button" id="out">Đổi mã</button></div>`:""}`;
  const go=document.getElementById("go"),inp=document.getElementById("code");
  const run=async()=>{go.disabled=true;go.textContent="Đang kiểm tra…";const r=await GY.login(inp.value);go.disabled=false;go.textContent="Mở bài";
    if(!r.ok){document.getElementById("msg").textContent=GY.ERR[r.error]||"Có lỗi, thử lại sau.";return}
    if(!GY.key(UNIT)){form(NOT(r.name));return}
    panel.innerHTML='<div class="loading">Đang mở bài…</div>';if(!await openLesson())form("Không mở được bài, thử tải lại trang.")};
  go.addEventListener("click",run);inp.addEventListener("keydown",e=>{if(e.key==="Enter")run()});
  const out=document.getElementById("out");if(out)out.addEventListener("click",()=>{GY.logout();form()});
}
(async()=>{
  let s=GY.session();
  if(s){s=await GY.refresh(false)}
  if(s&&GY.key(UNIT)){if(await openLesson())return}
  const raw=GY.rawSession();
  form(raw&&new Date(raw.exp)<new Date()?GY.ERR.expired:(s&&!GY.key(UNIT)?NOT(s.name):""));
})();
</script>
</body>
</html>
